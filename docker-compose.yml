services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-creative-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_creative_hub
    ports:
      - "5433:5432"
    volumes:
      - ai-creative-hub-db-data:/var/lib/postgresql/data

volumes:
  ai-creative-hub-db-data: