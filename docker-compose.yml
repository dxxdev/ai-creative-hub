services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-creative-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_creative_hub
    ports:
      - "5433:5432"
    volumes:
      - ai-creative-hub-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-creative-hub-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ai-creative-hub-redis-data:/data

volumes:
  ai-creative-hub-db-data:
  ai-creative-hub-redis-data: